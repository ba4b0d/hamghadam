<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFBA08"/>
      <stop offset="1" stop-color="#F15B2A"/>
    </linearGradient>
    <linearGradient id="light" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFE9A8"/>
      <stop offset="1" stop-color="#FFD166"/>
    </linearGradient>
  </defs>

  <!-- Warm rounded-square background (adaptive-icon backdrop) -->
  <rect x="24" y="24" width="464" height="464" rx="104" fill="url(#bg)"/>

  <!-- Two friends walking "in step together": back foot (heel lower-left, toe up-right) -->
  <g fill="url(#light)">
    <!-- rear foot -->
    <path d="M208 300
             C178 332 168 384 200 408
             C214 419 234 423 252 412
             C287 392 300 338 292 300 Z"
          transform="rotate(-14 244 356)" opacity="0.95"/>
    <!-- front foot (ahead, toe cleared) -->
    <path d="M296 232
             C266 264 256 316 288 340
             C302 351 322 355 340 344
             C366 322 374 288 368 250 Z"
          transform="rotate(6 330 300)" opacity="1"/>
  </g>

  <!-- subtle motion/connection line: the shared "step" -->
  <path d="M150 396 C220 366 300 366 372 396"
        fill="none" stroke="#FFFFFF" stroke-opacity="0.35"
        stroke-width="14" stroke-linecap="round"/>

  <!-- spark/pace dots behind the leading foot -->
  <circle cx="372" cy="248" r="12" fill="#FFFFFF" opacity="0.85"/>
  <circle cx="418" cy="236" r="8"  fill="#FFFFFF" opacity="0.55"/>
  <circle cx="404" cy="296" r="7"  fill="#FFFFFF" opacity="0.5"/>
</svg>