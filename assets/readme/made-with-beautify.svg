<svg xmlns="http://www.w3.org/2000/svg" width="420" height="64" viewBox="0 0 420 64" role="img" aria-labelledby="title desc">
  <title id="title">README made with beautify-github-readme</title>
  <desc id="desc">Visual styling signature card for HamPa GitHub README.</desc>

  <rect width="420" height="64" rx="16" fill="#1B1614" stroke="#382C25" stroke-width="1.5"/>
  
  <g transform="translate(20, 20)">
    <circle cx="12" cy="12" r="12" fill="#F15B2A"/>
    <text x="12" y="17" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="13" font-weight="900" fill="#FFFFFF">⚡</text>

    <text x="34" y="16" font-family="-apple-system, sans-serif" font-size="12" font-weight="600" fill="#A3988E">README MADE WITH</text>
    <text x="160" y="16" font-family="-apple-system, sans-serif" font-size="13" font-weight="800" fill="#FFBA08">beautify-github-readme</text>
    <text x="370" y="16" font-family="-apple-system, sans-serif" font-size="14" font-weight="700" fill="#F15B2A">↗</text>
  </g>
</svg>