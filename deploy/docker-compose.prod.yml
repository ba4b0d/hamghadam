name: hamghadam-prod

services:
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hamghadam}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hamghadam_secure_pass_2026}
      POSTGRES_DB: ${POSTGRES_DB:-hamghadam_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hamghadam} -d ${POSTGRES_DB:-hamghadam_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ../backend
      dockerfile: Dockerfile
    restart: always
    ports:
      - "8008:8000"   # host 8008 -> container 8000 (3000 is taken by ntopng on RP5; NPM routes the domain to 8008)
    environment:
      - APP_ENV=production
      - DATABASE_URL=postgresql://${POSTGRES_USER:-hamghadam}:${POSTGRES_PASSWORD:-hamghadam_secure_pass_2026}@db:5432/${POSTGRES_DB:-hamghadam_db}
      - SECRET_KEY=${SECRET_KEY:-change_this_to_a_random_secret_key_32_bytes_long}
      - CORS_ORIGINS=${CORS_ORIGINS:-*}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - FCM_DRY_RUN=${FCM_DRY_RUN:-false}
      - FCM_CREDENTIALS_PATH=/app/secrets/firebase-service-account.json
    volumes:
      - ../secrets:/app/secrets:ro
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"

volumes:
  postgres_data:
